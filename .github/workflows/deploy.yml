name: Deploy

# Builds the site and publishes it to GitHub Pages. Pages serves this as a
# project page, so everything lives under /rigseed and astro.config.mjs sets
# `base` to match. A mismatch there 404s every asset in production while
# working perfectly in dev, which is the failure this pairing exists to avoid.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
  # Kept for the case this file cannot cover on its own: rebuilding to pick up
  # a changelog entry when nothing here has changed, such as after a release
  # that was edited, or a prerelease.
  workflow_dispatch:
  #
  # There was a repository_dispatch here, sent by the app's release workflow so
  # the changelog would not sit a version behind. It is gone, because the
  # check:release step below means this site cannot build at all while
  # src/consts.ts names an older release than the newest published one.
  #
  # Every release therefore needs a commit here, and that commit's merge is a
  # push to main, which is already a trigger. The dispatch arrived before the
  # commit, so all it did was start a build the guard was certain to fail.

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Build
        run: pnpm run build
        env:
          # The changelog page fetches the app's releases at build time, and an
          # unauthenticated request is limited to sixty an hour counted by IP,
          # which on a shared runner is not ours alone. The build throws rather
          # than shipping an empty changelog, so without this the page is one
          # busy neighbour away from failing the build.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same reasoning as the base path, for the version and checksums the
      # download page states. They are maintained by hand and drifted across
      # 0.1.4 and 0.1.5 unnoticed. Failing here also stops a deploy that would
      # advertise a release still sitting as a draft, whose assets do not exist.
      - name: Confirm the stated release matches the newest published one
        run: pnpm run check:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The base path is the one thing that cannot be caught by looking at dev.
      # If it regresses, every stylesheet and image 404s in production and the
      # page still builds green, so it is asserted on the built output.
      - name: Confirm the build is rooted at /rigseed
        run: |
          set -euo pipefail
          if ! grep -q '"/rigseed/_astro/' dist/index.html; then
            echo "::error::built asset paths are not under /rigseed, so Pages will 404 them"
            grep -o '_astro/[^"]*' dist/index.html | head -3
            exit 1
          fi
          echo "asset paths are correctly based"

      # enablement lets the action create the Pages site if it does not exist.
      # Without it the first deploy of a repository fails with "Get Pages site
      # failed" and the fix is a settings change nobody has written down, which
      # is exactly how this one failed the first time.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
